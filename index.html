<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>₦airaVault · personal wallet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b2e1f 0%, #0f3d2a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .wallet-container {
      max-width: 520px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 40px;
      padding: 24px;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.5);
    }

    /* login screen */
    .auth-screen {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #d4edc9;
    }

    .logo-icon {
      background: #f5b342;
      width: 48px;
      height: 48px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 26px;
      color: #0b2e1f;
      box-shadow: 0 8px 0 #9e6f1e;
    }

    .logo h1 {
      font-weight: 600;
      font-size: 28px;
      letter-spacing: -0.5px;
      color: #e6f7da;
    }

    .logo span {
      font-weight: 300;
      font-size: 16px;
      color: #b1d8a4;
      margin-left: 6px;
    }

    .auth-form {
      background: #1a3e2b;
      padding: 28px 20px;
      border-radius: 32px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 8px 0 #0a1f14;
      border: 1px solid #3c6e4c;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      color: #c3e0b0;
      font-weight: 500;
      margin-bottom: 6px;
      font-size: 15px;
    }

    .input-field {
      width: 100%;
      padding: 16px 18px;
      background: #0e2c1d;
      border: 1.5px solid #2e6b42;
      border-radius: 24px;
      font-size: 16px;
      color: #f0ffe6;
      outline: none;
      transition: all 0.2s;
    }

    .input-field:focus {
      border-color: #f5b342;
      box-shadow: 0 0 0 3px rgba(245, 179, 66, 0.3);
    }

    .input-field::placeholder {
      color: #6f9e7c;
      font-weight: 300;
    }

    .btn {
      background: #f5b342;
      color: #0a2e1b;
      border: none;
      padding: 16px 22px;
      font-weight: 700;
      font-size: 18px;
      border-radius: 40px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 6px 0 #b57e28;
      transition: all 0.1s ease;
      border: 1px solid #ffe5a3;
      letter-spacing: 0.3px;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b57e28;
    }

    .btn.secondary {
      background: #cbdcc0;
      box-shadow: 0 5px 0 #8f9e84;
      color: #0b2e1f;
      border-color: #e2f0d6;
    }

    .btn.small {
      padding: 10px 16px;
      font-size: 15px;
      box-shadow: 0 4px 0 #b57e28;
    }

    .error-message {
      color: #ffb0a0;
      margin-top: 12px;
      font-weight: 500;
      text-align: center;
    }

    /* dashboard screen */
    .dashboard {
      display: none;
      flex-direction: column;
      gap: 22px;
    }

    .wallet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ebffe0;
    }

    .greeting {
      font-size: 22px;
      font-weight: 600;
    }

    .logout-btn {
      background: none;
      border: 1.5px solid #6f9e7c;
      color: #d4f0c0;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      font-size: 14px;
    }

    .logout-btn:hover {
      background: #2c5a3a;
    }

    .balance-card {
      background: #0b2e1f;
      border-radius: 36px;
      padding: 28px 24px;
      border: 1px solid #3b7852;
      box-shadow: inset 0 1px 3px #1e5736, 0 12px 0 #07170e;
      text-align: center;
    }

    .balance-label {
      color: #b1d8a4;
      font-size: 18px;
      letter-spacing: 1px;
    }

    .balance-amount {
      font-size: 58px;
      font-weight: 800;
      color: #f9f2d9;
      line-height: 1.2;
      word-break: break-word;
    }

    .balance-amount small {
      font-size: 28px;
      font-weight: 500;
      color: #c6e2b4;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .action-card {
      background: #1e4a31;
      border-radius: 28px;
      padding: 20px 10px;
      box-shadow: inset 0 1px 2px #407a54, 0 8px 0 #0b2617;
      border: 1px solid #3e8057;
      cursor: pointer;
      text-align: center;
      transition: 0.15s;
      color: #f2ffe3;
    }

    .action-card:active {
      transform: translateY(4px);
      box-shadow: inset 0 1px 2px #407a54, 0 4px 0 #0b2617;
    }

    .action-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .action-title {
      font-weight: 600;
      font-size: 18px;
    }

    /* modal overlay */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 20, 5, 0.8);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-card {
      background: #153f28;
      max-width: 420px;
      width: 100%;
      border-radius: 36px;
      padding: 24px;
      box-shadow: 0 25px 30px #00000033, 0 8px 0 #0b2416;
      border: 1px solid #5b9a6e;
    }

    .modal-title {
      color: #e6ffd6;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .modal .input-group {
      margin-bottom: 24px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
    }

    .transaction-list {
      margin-top: 8px;
      background: #0e301e;
      border-radius: 24px;
      padding: 6px 4px;
      max-height: 200px;
      overflow-y: auto;
    }

    .tx-item {
      background: #1c412b;
      margin: 6px 4px;
      padding: 14px 18px;
      border-radius: 24px;
      color: #dff0cf;
      display: flex;
      justify-content: space-between;
      border-left: 6px solid #f5b342;
      font-size: 15px;
    }

    .tx-amount {
      font-weight: 700;
    }

    .note {
      color: #afcf9a;
      margin-top: 10px;
      font-size: 14px;
      text-align: center;
    }

    hr {
      border: 1px solid #2e6b42;
      margin: 16px 0;
    }
  </style>
</head>
<body>
<div class="wallet-container">
  <!-- LOGIN / REGISTER SCREEN (exclusive password) -->
  <div id="authScreen" class="auth-screen">
    <div class="logo">
      <div class="logo-icon">₦</div>
      <h1>NairaVault <span>· solo</span></h1>
    </div>
    <div class="auth-form">
      <div class="input-group">
        <label>👤 Username</label>
        <input type="text" id="loginUsername" class="input-field" placeholder="e.g., kelvin_ng" autocomplete="off">
      </div>
      <div class="input-group">
        <label>🔐 Exclusive password</label>
        <input type="password" id="loginPassword" class="input-field" placeholder="··········">
      </div>
      <button class="btn" id="loginBtn">🔓 Access my wallet</button>
      <button class="btn secondary" id="createWalletBtn" style="margin-top: 12px;">✨ Create new wallet</button>
      <div id="authError" class="error-message"></div>
      <div class="note">⚡ Only you can access — your data stays in this browser</div>
    </div>
  </div>

  <!-- MAIN DASHBOARD (hidden until login) -->
  <div id="dashboardScreen" class="dashboard">
    <div class="wallet-header">
      <div class="greeting" id="greetingUser">👋</div>
      <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
    </div>

    <div class="balance-card">
      <div class="balance-label">₦ BALANCE</div>
      <div class="balance-amount" id="balanceDisplay">₦0.00</div>
    </div>

    <div class="action-grid">
      <div class="action-card" id="topupAction">
        <div class="action-icon">⬆️➕</div>
        <div class="action-title">Top up</div>
      </div>
      <div class="action-card" id="payBillAction">
        <div class="action-icon">🧾💡</div>
        <div class="action-title">Pay bill</div>
      </div>
      <div class="action-card" id="transferAction">
        <div class="action-icon">💸↗️</div>
        <div class="action-title">Transfer</div>
      </div>
      <div class="action-card" id="historyAction">
        <div class="action-icon">📋</div>
        <div class="action-title">History</div>
      </div>
    </div>

    <!-- mini recent tx preview -->
    <div style="color:#cbe8bb; font-weight:500; margin-top:8px;">📌 Recent activity</div>
    <div class="transaction-list" id="recentTxList">
      <div style="padding:16px; text-align:center; color:#7fa381;">No transactions yet</div>
    </div>
  </div>
</div>

<!-- MODALS (Top-up, Pay bill, Transfer) -->
<div class="modal" id="topupModal">
  <div class="modal-card">
    <div class="modal-title">⬆️ Top up Naira</div>
    <div class="input-group">
      <label>Amount (₦)</label>
      <input type="number" id="topupAmount" class="input-field" placeholder="5000" min="1" step="1">
    </div>
    <div class="modal-actions">
      <button class="btn small secondary" id="cancelTopup">Cancel</button>
      <button class="btn small" id="confirmTopup">Add funds</button>
    </div>
    <div id="topupError" class="error-message"></div>
  </div>
</div>

<div class="modal" id="billModal">
  <div class="modal-card">
    <div class="modal-title">🧾 Pay bill</div>
    <div class="input-group">
      <label>Bill type (e.g., IKEDC, DSTV)</label>
      <input type="text" id="billType" class="input-field" placeholder="Electricity">
    </div>
    <div class="input-group">
      <label>Amount (₦)</label>
      <input type="number" id="billAmount" class="input-field" placeholder="2500" min="1">
    </div>
    <div class="modal-actions">
      <button class="btn small secondary" id="cancelBill">Cancel</button>
      <button class="btn small" id="confirmBill">Pay bill</button>
    </div>
    <div id="billError" class="error-message"></div>
  </div>
</div>

<div class="modal" id="transferModal">
  <div class="modal-card">
    <div class="modal-title">💸 Transfer to person</div>
    <div class="input-group">
      <label>Recipient (username/name)</label>
      <input type="text" id="transferRecipient" class="input-field" placeholder="jane_doe">
    </div>
    <div class="input-group">
      <label>Amount (₦)</label>
      <input type="number" id="transferAmount" class="input-field" placeholder="1000" min="1">
    </div>
    <div class="modal-actions">
      <button class="btn small secondary" id="cancelTransfer">Cancel</button>
      <button class="btn small" id="confirmTransfer">Send</button>
    </div>
    <div id="transferError" class="error-message"></div>
  </div>
</div>

<script>
  (function(){
    'use strict';

    // ---------- STORAGE KEYS ----------
    const STORAGE_WALLET = 'naira_wallet_exclusive';
    const STORAGE_CREDS = 'naira_creds_exclusive';

    // ---------- GLOBAL STATE ----------
    let currentUser = null;                // { username, password (hashed-like, just for demo) }
    let walletData = {
      balance: 0,
      transactions: []      // { type, amount, description, date }
    };

    // DOM elements
    const authScreen = document.getElementById('authScreen');
    const dashboardScreen = document.getElementById('dashboardScreen');
    const loginUsername = document.getElementById('loginUsername');
    const loginPassword = document.getElementById('loginPassword');
    const authError = document.getElementById('authError');
    const loginBtn = document.getElementById('loginBtn');
    const createWalletBtn = document.getElementById('createWalletBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const greetingUser = document.getElementById('greetingUser');
    const balanceDisplay = document.getElementById('balanceDisplay');
    const recentTxList = document.getElementById('recentTxList');

    // Modals
    const topupModal = document.getElementById('topupModal');
    const billModal = document.getElementById('billModal');
    const transferModal = document.getElementById('transferModal');
    const topupAmount = document.getElementById('topupAmount');
    const billType = document.getElementById('billType');
    const billAmount = document.getElementById('billAmount');
    const transferRecipient = document.getElementById('transferRecipient');
    const transferAmount = document.getElementById('transferAmount');
    const topupError = document.getElementById('topupError');
    const billError = document.getElementById('billError');
    const transferError = document.getElementById('transferError');

    // Buttons
    document.getElementById('topupAction').addEventListener('click', ()=> openModal(topupModal));
    document.getElementById('payBillAction').addEventListener('click', ()=> openModal(billModal));
    document.getElementById('transferAction').addEventListener('click', ()=> openModal(transferModal));
    document.getElementById('historyAction').addEventListener('click', ()=>{
      alert('📋 Full transaction history is shown below balance card.');
    });

    // cancel buttons
    document.getElementById('cancelTopup').addEventListener('click', ()=> closeModal(topupModal));
    document.getElementById('cancelBill').addEventListener('click', ()=> closeModal(billModal));
    document.getElementById('cancelTransfer').addEventListener('click', ()=> closeModal(transferModal));

    // confirm actions
    document.getElementById('confirmTopup').addEventListener('click', handleTopup);
    document.getElementById('confirmBill').addEventListener('click', handlePayBill);
    document.getElementById('confirmTransfer').addEventListener('click', handleTransfer);

    // modal close on background click
    [topupModal, billModal, transferModal].forEach(m => {
      m.addEventListener('click', (e) => { if (e.target === m) closeModal(m); });
    });

    function openModal(modal) {
      modal.style.display = 'flex';
      // clear errors & inputs
      if (modal === topupModal) { topupAmount.value = ''; topupError.textContent = ''; }
      if (modal === billModal) { billType.value = ''; billAmount.value = ''; billError.textContent = ''; }
      if (modal === transferModal) { transferRecipient.value = ''; transferAmount.value = ''; transferError.textContent = ''; }
    }
    function closeModal(modal) { modal.style.display = 'none'; }

    // ---------- UTILS ----------
    function formatNaira(amount) {
      return '₦' + Number(amount).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function updateUI() {
      balanceDisplay.textContent = formatNaira(walletData.balance);
      renderRecentTransactions();
    }

    function renderRecentTransactions() {
      if (!walletData.transactions.length) {
        recentTxList.innerHTML = '<div style="padding:16px; text-align:center; color:#7fa381;">No transactions yet</div>';
        return;
      }
      const recent = [...walletData.transactions].reverse().slice(0, 5);
      recentTxList.innerHTML = recent.map(tx => {
        const sign = tx.type === 'topup' ? '+' : '-';
        return `<div class="tx-item"><span>${tx.description || tx.type}</span><span class="tx-amount">${sign}${formatNaira(tx.amount)}</span></div>`;
      }).join('');
    }

    function addTransaction(type, amount, description) {
      walletData.transactions.push({
        type, amount, description,
        date: new Date().toLocaleString()
      });
      if (type === 'topup') walletData.balance += amount;
      else walletData.balance -= amount;
      saveWallet();
      updateUI();
    }

    function saveWallet() {
      if (currentUser) {
        localStorage.setItem(STORAGE_WALLET + '_' + currentUser.username, JSON.stringify(walletData));
      }
    }

    function loadWallet(username) {
      const saved = localStorage.getItem(STORAGE_WALLET + '_' + username);
      if (saved) {
        walletData = JSON.parse(saved);
      } else {
        walletData = { balance: 0, transactions: [] };
      }
    }

    // save credentials (simplified, plain comparison for demo)
    function saveCredentials(username, password) {
      const creds = { username, password }; // demo, not hashed
      localStorage.setItem(STORAGE_CREDS + '_' + username, JSON.stringify(creds));
    }

    function getStoredCredentials(username) {
      const data = localStorage.getItem(STORAGE_CREDS + '_' + username);
      return data ? JSON.parse(data) : null;
    }

    // Login flow
    function attemptLogin(username, password) {
      const stored = getStoredCredentials(username);
      if (!stored) return false;
      return stored.password === password;
    }

    function doLogin(username) {
      currentUser = { username };
      loadWallet(username);
      showDashboard();
    }

    function showDashboard() {
      authScreen.style.display = 'none';
      dashboardScreen.style.display = 'flex';
      greetingUser.textContent = `👋 ${currentUser.username}`;
      updateUI();
    }

    function showAuthScreen() {
      dashboardScreen.style.display = 'none';
      authScreen.style.display = 'flex';
      loginUsername.value = '';
      loginPassword.value = '';
      authError.textContent = '';
      currentUser = null;
    }

    // event: login
    loginBtn.addEventListener('click', () => {
      const user = loginUsername.value.trim();
      const pass = loginPassword.value;
      if (!user || !pass) {
        authError.textContent = 'Enter username and exclusive password';
        return;
      }
      if (attemptLogin(user, pass)) {
        doLogin(user);
      } else {
        authError.textContent = 'Invalid username or password';
      }
    });

    // create new wallet (exclusive to you)
    createWalletBtn.addEventListener('click', () => {
      const user = loginUsername.value.trim();
      const pass = loginPassword.value;
      if (!user || !pass) {
        authError.textContent = 'Choose username & password';
        return;
      }
      if (getStoredCredentials(user)) {
        authError.textContent = 'Username already exists. Login instead.';
        return;
      }
      // create credentials
      saveCredentials(user, pass);
      // init empty wallet
      walletData = { balance: 0, transactions: [] };
      localStorage.setItem(STORAGE_WALLET + '_' + user, JSON.stringify(walletData));
      doLogin(user);
    });

    logoutBtn.addEventListener('click', () => {
      showAuthScreen();
    });

    // ----- HANDLERS -----
    function handleTopup() {
      const amt = parseFloat(topupAmount.value);
      if (isNaN(amt) || amt <= 0) {
        topupError.textContent = 'Enter a valid amount';
        return;
      }
      addTransaction('topup', amt, 'Top up');
      closeModal(topupModal);
    }

    function handlePayBill() {
      const type = billType.value.trim();
      const amt = parseFloat(billAmount.value);
      if (!type) { billError.textContent = 'Enter bill type'; return; }
      if (isNaN(amt) || amt <= 0) { billError.textContent = 'Valid amount required'; return; }
      if (amt > walletData.balance) { billError.textContent = 'Insufficient balance'; return; }
      addTransaction('bill', amt, `Bill: ${type}`);
      closeModal(billModal);
    }

    function handleTransfer() {
      const recipient = transferRecipient.value.trim();
      const amt = parseFloat(transferAmount.value);
      if (!recipient) { transferError.textContent = 'Enter recipient name'; return; }
      if (isNaN(amt) || amt <= 0) { transferError.textContent = 'Enter valid amount'; return; }
      if (amt > walletData.balance) { transferError.textContent = 'Insufficient funds'; return; }
      addTransaction('transfer', amt, `Transfer to ${recipient}`);
      closeModal(transferModal);
    }

    // enter key quick login
    loginPassword.addEventListener('keypress', (e) => { if(e.key==='Enter') loginBtn.click(); });

    // initial state: show auth
    showAuthScreen();

    // prefill any saved session? none. keep exclusive.
    // for convenience, if user was logged in? we don't auto-login for security (exclusive)
  })();
</script>
</body>
</html>
